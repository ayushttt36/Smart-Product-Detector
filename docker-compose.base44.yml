services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      # Vite >= 6.1 appends this to allowedHosts so the preview's external hostname is accepted.
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:
      # Force polling so file changes on the bind mount trigger HMR.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "500"
    command: sh -c "npm install --no-audit --no-fund && npx vite dev --host 0.0.0.0 --port 3000 --strictPort"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
